<!doctype html><html><meta charset="utf-8"><title>YouTube settings lifecycle</title>
<style>#movie_player{position:relative;width:720px;height:405px}video{width:100%;height:100%}</style>
<div id="movie_player"><video muted></video><div class="ytp-chrome-bottom" style="position:absolute;bottom:0;height:48px;width:100%"><button class="ytp-subtitles-button" aria-pressed="true">CC</button></div></div><pre id="summary"></pre>
<script>
globalThis.__gxtYtTestMode=true;
globalThis.GXT_SHIM_SEED={settings:{enabled:true,ytAuto:false,ytDub:false},apiKeys:['dev-key']};
const player=document.getElementById('movie_player'),video=player.querySelector('video');
let videoId='settings-a';const track={languageCode:'en',baseUrl:'https://www.youtube.com/api/timedtext?v=settings-a&lang=en&pot=fixture',name:{simpleText:'English'}};
player.getPlayerResponse=()=>({videoDetails:{videoId,title:'Settings test'},playabilityStatus:{status:'OK'},captions:{playerCaptionsTracklistRenderer:{captionTracks:[track]}}});
player.getOption=(mod,key)=>key==='tracklist'?[track]:track;player.loadModule=()=>{};player.unloadModule=()=>{};player.setOption=()=>{};
const nativeCc=player.querySelector('button');nativeCc.onclick=()=>nativeCc.setAttribute('aria-pressed',nativeCc.getAttribute('aria-pressed')==='true'?'false':'true');
const realFetch=window.fetch.bind(window);
window.fetch=(input,init)=>String(input).includes('/api/timedtext')?Promise.resolve(new Response(JSON.stringify({events:[{tStartMs:0,dDurationMs:4000,segs:[{utf8:'The original sentence.'}]}]}))):realFetch(input,init);
Object.defineProperty(video,'currentTime',{configurable:true,get:()=>1});Object.defineProperty(video,'paused',{configurable:true,get:()=>true});
history.replaceState(null,'','/watch?v='+videoId);
let route=message=>({ok:true,list:message.texts.map(t=>'فارسی '+t)});const sent=[];
globalThis.GXT_SHIM_HANDLER=message=>{sent.push(message);return route(message)};
</script>
<script src="/dev/chrome-shim.js"></script><script src="/shared/settings.js"></script><script src="/shared/theme.js"></script><script src="/content/ui.js"></script><script src="/content/player.css.js"></script><script src="/content/dub.js"></script><script src="/content/yt-main.js"></script><script src="/content/youtube.js"></script>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const assert=(ok,reason='assertion failed')=>{if(!ok)throw Error(reason)};
const defer=()=>{let resolve;const promise=new Promise(r=>resolve=r);return{promise,resolve}};
async function until(fn,reason='timed out',ms=3500){const end=Date.now()+ms;while(Date.now()<end){if(fn())return;await sleep(15)}throw Error(reason)}
const I=()=>GXT.yt._internal,Q=sel=>I().q(sel),painted=()=>I().surfaceRoot()?.textContent||'';
let config;async function settings(patch){config={...config,...patch};await chrome.storage.local.set({settings:config})}
async function activate(){await until(()=>I().trackCount()===1&&Q('#gxt-yt-pill'));Q('#gxt-yt-pill').click();await until(()=>I().subState()==='active')}
function wav(){const b=new ArrayBuffer(2044),v=new DataView(b);for(const[offset,s]of[[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])for(let i=0;i<s.length;i++)v.setUint8(offset+i,s.charCodeAt(i));v.setUint32(4,2036,true);v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);v.setUint32(40,2000,true);return btoa(String.fromCharCode(...new Uint8Array(b)))}
const audioData=wav(),engines=[];
function engine(send,overrides={}){const el=document.createElement('video');el.muted=true;const instance=GXT.dub.create({video:el,send,settings:{...GXT.DEFAULTS,...overrides}});engines.push(instance);instance.start();instance.setSegments([{id:'same',start:5000,end:8000,text:'متن فارسی'}]);return instance}
const tests=[
 ['YouTube provider switch retranslates completed visible captions',async()=>{route=m=>({ok:true,list:m.texts.map(()=>config.provider==='google'?'NEW PROVIDER':'OLD PROVIDER')});await activate();await until(()=>painted().includes('OLD PROVIDER'));await settings({provider:'google'});await until(()=>painted().includes('NEW PROVIDER'),'completed captions kept old provider')}],
 ['YouTube model switch rejects late old caption batch',async()=>{const old=defer();let count=0;route=m=>++count===1?old.promise:{ok:true,list:m.texts.map(()=>'NEW MODEL')};await activate();await until(()=>count===1);await settings({model:'replacement-model'});await sleep(150);old.resolve({ok:true,list:['STALE MODEL']});await sleep(80);assert(!painted().includes('STALE MODEL'),'old model rendered after settings changed');await until(()=>painted().includes('NEW MODEL'),'new model request missing')}],
 ['YouTube repeated provider flips keep only final response',async()=>{for(let i=0;i<15;i++){await settings({enabled:false});const old=defer();let count=0;route=m=>++count===1?old.promise:{ok:true,list:m.texts.map(()=>'FINAL '+i)};await settings({enabled:true,provider:'gemini'});await activate();await until(()=>count===1);await settings({provider:'google'});await settings({provider:'gemini'});await sleep(100);old.resolve({ok:true,list:['STALE FLIP '+i]});await until(()=>painted().includes('FINAL '+i),'final settings not applied on cycle '+i);assert(!painted().includes('STALE FLIP'))}}],
 ['dub voice switch clears already synthesized clips',async()=>{const e=engine(()=>({ok:true,data:audioData}));e.update();await until(()=>e.stats().ready===1);e.configure({...GXT.DEFAULTS,ttsVoiceBing:'fa-IR-FaridNeural'});assert(e.stats().ready===0,'cached audio survives voice change');e.update();await until(()=>e.stats().ready===1)}],
 ['dub late synthesis cannot fill replacement voice generation',async()=>{const old=defer();let count=0;const e=engine(()=>++count===1?old.promise:{ok:true,data:audioData});e.update();await until(()=>count===1);e.configure({...GXT.DEFAULTS,ttsVoiceBing:'fa-IR-FaridNeural'});e.update();await sleep(30);old.resolve({ok:true,data:audioData});await sleep(70);assert(count===2,'new voice did not synthesize while old voice was pending');assert(e.stats().pending===0&&e.stats().ready===1)}],
 ['dub voice changes remain restartable across 25 cycles',async()=>{let count=0;const e=engine(()=>{count++;return{ok:true,data:audioData}});for(let i=0;i<25;i++){e.configure({...GXT.DEFAULTS,ttsVoiceBing:i%2?'fa-IR-DilaraNeural':'fa-IR-FaridNeural'});e.update();await until(()=>e.stats().ready===1);assert(count===i+1,'voice cache not refreshed at cycle '+i)}e.stop();assert(e.stats().pending===0&&e.stats().ready===0&&!e.stats().running)}],
 ['cosmetic dub setting changes preserve synthesized audio',async()=>{const e=engine(()=>({ok:true,data:audioData}));e.update();await until(()=>e.stats().ready===1);e.configure({...GXT.DEFAULTS,uiAccent:'rose',ytDubDuck:15});assert(e.stats().ready===1)}],
 ['live model changes reconnect and retire previous transcript callbacks',async()=>{const ports=[],texts=[];const el=document.createElement('video');el.muted=true;Object.defineProperty(el,'paused',{get:()=>false});const e=GXT.dub.create({video:el,send:()=>({ok:false}),settings:{...GXT.DEFAULTS,ytLiveModel:'old-live'},onLiveText:m=>texts.push(m.text),connectLive:()=>{const callbacks=[];const port={postMessage(){},disconnect(){port.closed=true},onMessage:{addListener:f=>callbacks.push(f)},onDisconnect:{addListener(){}},emit:m=>callbacks.forEach(f=>f(m))};ports.push(port);return port}});engines.push(e);e.start('live');assert(ports.length===1,'live fixture did not open initial session');e.configure({...GXT.DEFAULTS,ytLiveModel:'new-live'});assert(ports.length===2&&ports[0].closed,'live model did not reconnect');ports[0].emit({t:'text',kind:'target',text:'STALE LIVE'});ports[1].emit({t:'text',kind:'target',text:'CURRENT LIVE'});assert(texts.join('|')==='CURRENT LIVE','old live transcript survived restart')}],
];
(async()=>{await sleep(70);config=await GXT.getSettings();let passed=0;const lines=[];for(const[name,fn]of tests){let error='';try{await fn();passed++}catch(e){error=e.message}const line=`GXT-YT-SETTINGS ${error?'FAIL':'PASS'} ${name}${error?': '+error:''}`;console.log(line);lines.push(line);for(const e of engines)e.stop();engines.length=0;await settings({enabled:false});await settings({enabled:true,provider:'gemini',model:GXT.DEFAULTS.model});sent.length=0;await sleep(30)}document.getElementById('summary').textContent=lines.join('\n');console.log(`GXT-YT-SETTINGS SUMMARY ${passed}/${tests.length}`)})();
</script></html>
