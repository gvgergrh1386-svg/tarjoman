<html lang="en">

<style>
  body { font: 14px/1.7 Consolas, monospace; background: #111; color: #eee; padding: 16px; }
  .pass { color: #0f8; }
  .fail { color: #f44; font-weight: bold; }

</head>
<body>
<h1>Background module self-test</h1>
<div id="out">running…</div>

<script src="chrome-shim.js?v=3300"></script>
<script src="../shared/settings.js?v=3300"></script>
<script src="../shared/memory.js?v=3300"></script>
<script src="../shared/theme.js?v=3300"></script>
<script src="../content/player.css.js?v=3300"></script>
<script src="../background/prompt.js?v=3300"></script>
<script src="../background/subtitle-prompts.js"></script>
<script src="../background/abort.js"></script>
<script src="../background/workshop.js"></script>
<script src="../background/cache.js?v=3300"></script>
<script src="../background/gemini.js?v=3300"></script>
<script src="../background/openai.js?v=3300"></script>
<script src="../background/mt.js?v=3300"></script>
<!-- v2.2.0 — speech. tts.js consumes GXT.mt.bingSession and GXT.gemini.synthesize. -->
<script src="../shared/subtitles.js?v=3300"></script>
<script src="../background/audio-cache.js?v=3300"></script>
<script src="../background/tts.js?v=3300"></script>
<script src="../background/bridge.js?v=3300"></script>
<!-- v2.1.0: the shared in-page UI layer and the two content engines now expose
     pure internals, so the suite can regression-test them for real. Loading
     them here is side-effect free: the page module only reacts to messages,
     and the YouTube module unmounts immediately outside a /watch URL. -->
<script src="../content/dub.js?v=3300"></script>
<script src="../content/ui.js?v=3300"></script>
<script src="../content/page-translate.js?v=3300"></script>
<script src="../content/manga.js?v=3300"></script>
<script src="../content/youtube.js?v=3300"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  const results = [];
  const t = async (name, fn) => {
    try { await fn(); results.push([name, true, '']); }
    catch (e) { results.push([name, false, String((e && e.message) || e)]); }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg || 'assertion failed'); };

  await t('buildTranslateRequest shape + now context', async () => {
    const body = GXT.prompt.buildTranslateRequest(
      [{ text: 'hi', lang: 'en', author: '@a', ctx: 'quoted' }],
      { thinkingLevel: 'minimal' }
    );
    const sys = body.systemInstruction.parts[0].text;
    assert(sys.length > 500, 'system prompt too short');
    assert(sys.includes('وای'), 'interjection localization rule missing');
    assert(sys.includes('Tehran'), 'Iran date/time rule missing');
    const payload = JSON.parse(body.contents[0].parts[0].text);
    assert(/^\d{4}-\d{2}-\d{2}$/.test(payload.now.gregorian), 'now.gregorian format');
    assert(payload.now.jalali.length > 4, 'now.jalali present');
    const item = payload.items[0];
    assert(item.i === 0 && item.text === 'hi' && item.lang === 'en', 'item payload');
    assert(item.author === '@a' && item.context === 'quoted', 'context payload');
    assert(body.generationConfig.responseMimeType === 'application/json', 'mime');
    assert(
      body.generationConfig.responseSchema.properties.r.items.properties.sl.type === 'string',
      'sl in schema'
    );
    assert(body.generationConfig.thinkingConfig.thinkingLevel === 'minimal', 'thinking cfg');
    const noThink = GXT.prompt.buildTranslateRequest([{ text: 'x' }], null);
    assert(!('thinkingConfig' in noThink.generationConfig), 'thinking omitted');
  });

  await t('parseTranslations: plain, fenced, sl, invalid', async () => {
    const p = GXT.prompt.parseTranslations;
    const plain = p('{"r":[{"i":0,"t":"سلام","sl":"EN"}]}').get(0);
    assert(plain.t === 'سلام', 'plain t');
    assert(plain.sl === 'en', 'sl lowercased');
    assert(p('```json\n{"r":[{"i":1,"t":"درود"}]}\n```').get(1).t === 'درود', 'fenced');
    assert(p('{"r":[{"i":0,"t":"x"}]}').get(0).sl === '', 'missing sl tolerated');
    let threw = false;
    try { p('nonsense'); } catch (e) { threw = e.code === 'BAD_RESPONSE'; }
    assert(threw, 'garbage must throw BAD_RESPONSE');
  });

  await t('v3.3.8 quality architecture: relevant context + invariant gate + batch review', () => {
    const P = GXT.prompt;
    const adaptive = P.buildItemsPayload([{ text: 'Great, another subscription. Just what we needed.' }]);
    assert(adaptive.styleExamples?.length === 1, 'relevant style example was not selected');
    const unrelated = P.buildItemsPayload([{ text: 'The weather is mild today.' }]);
    assert(!('styleExamples' in unrelated), 'unrelated few-shot example leaked into request');
    const extras = P.extrasBlock({
      glossary: 'API = رابط\nGhibli = جیبلی',
      memory: { API: 'رابط', Nintendo: 'نینتندو' },
    }, ['This API is stable']);
    assert(extras.includes('API') && !extras.includes('Ghibli') && !extras.includes('Nintendo'),
      'glossary/memory were not filtered to this request');
    assert(P.translationInvariant('Hi @user https://x.test/a 🔥', 'سلام @user https://x.test/a 🔥', 'tweet'),
      'valid protected content was rejected');
    assert(!P.translationInvariant('Hi @user 🔥', 'سلام 🔥', 'tweet'), 'dropped handle was accepted');
    const parsed = P.parseTranslations(
      '{"r":[{"i":0,"t":"سلام @a","sl":"en"},{"i":1,"t":"بدون هندل","sl":"en"}]}',
      ['hello @a', 'hello @b']
    );
    assert(parsed.has(0) && !parsed.has(1), 'only the invalid item should become a retry hole');
    const review = P.buildReviewTextsRequest(['ترجمه'], ['source'], 'page', null, null);
    assert(review.generationConfig.responseMimeType === 'application/json' &&
      review.generationConfig.temperature <= 0.2, 'batch editor is not structured/conservative');
  });

  await t('429: RetryInfo delay + QuotaFailure daily limit', async () => {
    const err = GXT.gemini._internal.classifyHttpError(429, {
      error: {
        message: 'quota exceeded',
        details: [
          { '@type': 'type.googleapis.com/google.rpc.RetryInfo', retryDelay: '27s' },
          {
            '@type': 'type.googleapis.com/google.rpc.QuotaFailure',
            violations: [
              { quotaId: 'GenerateRequestsPerDayPerProjectPerModel-FreeTier', quotaValue: '250' },
            ],
          },
        ],
      },
    });
    assert(err.code === 'RATE_LIMIT', 'code');
    assert(err.retryAfterMs === 27000, 'delay ' + err.retryAfterMs);
    assert(err.dailyLimit === 250, 'dailyLimit ' + err.dailyLimit);
    assert(err.retriable, 'retriable');
  });

  await t('date engine: exact Jalali anchors (code, not model)', async () => {
    const fixed = new Date('2026-07-17T09:00:00Z');
    const nc = GXT.prompt.nowContext(fixed);
    assert(nc.jalali.includes('تیر') && nc.jalali.includes('۱۴۰۵'), 'today jalali ' + nc.jalali);
    assert(!('jalaliByGregorianMonth' in nc), 'anchor table no longer shipped in prompts');
    const anchors = GXT.prompt.jalaliByGregorianMonth(fixed);
    assert(anchors['2026-10'] === '۹ مهر ۱۴۰۵', 'Oct anchor: ' + anchors['2026-10']);
    assert(anchors['2026-06'] === '۱۱ خرداد ۱۴۰۵', 'Jun anchor: ' + anchors['2026-06']);
  });

  await t('detectDates: client-side Gregorian→Jalali, zero model math', async () => {
    const fixed = new Date('2026-07-17T09:00:00Z');
    const d = GXT.prompt.detectDates;
    // The user's original bug case: yearless upcoming date.
    assert(d('The new manga starts October 3!', fixed)['October 3'] === '۱۱ مهر ۱۴۰۵', 'Oct 3');
    // Full date with year.
    assert(d('See you March 5, 2026 at 3pm', fixed)['March 5, 2026'] === '۱۴ اسفند ۱۴۰۴', 'Mar 5 2026');
    // Day-month order + ISO.
    assert(d('event on 5 March 2026', fixed)['5 March 2026'] === '۱۴ اسفند ۱۴۰۴', '5 March 2026');
    assert(d('deadline 2026-10-03 ok', fixed)['2026-10-03'] === '۱۱ مهر ۱۴۰۵', 'ISO');
    // Guards: no bare-word "may", no invalid dates, no dates at all.
    assert(d('this may be fine', fixed) === null, '"may" without a day number');
    assert(d('Feb 30 is fake', fixed) === null, 'invalid date rejected');
    assert(d('no dates here', fixed) === null, 'no digits');
    // Payload wiring: hints attach per item only when present.
    const payload = GXT.prompt.buildItemsPayload([
      { text: 'starts October 3' },
      { text: 'hello world' },
    ]);
    assert(payload.items[0].dates['October 3'] === '۱۱ مهر ۱۴۰۵', 'hint attached');
    assert(!('dates' in payload.items[1]), 'no hint when no date');
  });

  await t('defaultDailyLimit: known + heuristic', async () => {
    assert(GXT.defaultDailyLimit('gemini-3.5-flash') === 1500, 'flash default');
    assert(GXT.defaultDailyLimit('gemini-2.5-pro') === 50, '2.5 pro default');
    assert(GXT.defaultDailyLimit('gemini-9-flash-preview') === 1500, 'unknown flash heuristic');
    assert(GXT.defaultDailyLimit('some-pro-x') === 100, 'unknown pro heuristic');
    assert(GXT.defaultDailyLimit('') === 0, 'empty = 0');
  });

  await t('PROMPT_VERSION bumped; prompt uses hints, no calendar math', async () => {
    assert(GXT.prompt.PROMPT_VERSION >= 5, 'version ' + GXT.prompt.PROMPT_VERSION);
    const sys = GXT.prompt.SYSTEM_PROMPT;
    assert(/copy them verbatim, never recompute/.test(sys), 'verbatim hint rule present');
    assert(!sys.includes('jalaliByGregorianMonth'), 'anchor table gone');
    assert(sys.includes('وای'), 'interjection localization rule present');
    assert(sys.includes('⟦n⟧'), 'placeholder rule survived the diet');
  });

  await t('v1.6.5: tweet prompt quality pass — context + times integration', async () => {
    const sys = GXT.prompt.SYSTEM_PROMPT;
    // Context-awareness for disambiguation (author + reply/quote context).
    assert(/CONTEXT/.test(sys) && /in reply to|replying to/i.test(sys), 'reply/quote context documented');
    assert(/"times"/.test(sys), 'times hint documented in the prompt');
    // Structural-flow guidance (rebuild in Persian order, never calque).
    assert(/never carry English structure|Persian word order/i.test(sys), 'structural-flow rule present');
    // Batch-level terminology consistency.
    assert(/terminology.*consistent|consistent.*across them/i.test(sys), 'batch consistency rule present');
    // The INPUT schema advertises the new times field.
    assert(/"times":\{\.\.\.\}/.test(sys), 'INPUT schema advertises times');
  });

  await t('v1.6.5: detectTimes — client-side timezone→Tehran, zero model math', async () => {
    const fixed = new Date('2026-07-17T09:00:00Z'); // summer: US DST is active
    const d = GXT.prompt.detectTimes;
    // Fixed-offset standard/daylight abbreviations.
    assert(d('live at 3pm EST', fixed)['3pm EST'] === '۲۳:۳۰', 'EST -5 → 23:30');
    assert(d('starts 3:30pm EST', fixed)['3:30pm EST'] === '۰۰:۰۰ (روز بعد)', 'EST rollover past midnight');
    assert(d('drop at 15:00 UTC', fixed)['15:00 UTC'] === '۱۸:۳۰', 'UTC 15:00 → 18:30');
    assert(d('meet 9 AM PT', fixed)['9 AM PT'] !== undefined, 'ambiguous PT resolved (IANA)');
    // PT in summer = PDT (-7): 9:00 + (210 - (-420)) = 9:00 + 10:30 = 19:30.
    assert(d('meet 9 AM PT', fixed)['9 AM PT'] === '۱۹:۳۰', 'PT in July = PDT: 9am → 19:30');
    // 24h with timezone, and worded times.
    assert(d('at 23:00 CET', fixed)['23:00 CET'] === '۰۱:۳۰ (روز بعد)', 'CET 23:00 → 01:30 next day');
    assert(d('noon UTC', fixed)['noon UTC'] === '۱۵:۳۰', 'noon UTC → 15:30');
    assert(d('midnight GMT', fixed)['midnight GMT'] === '۰۳:۳۰', 'midnight GMT → 03:30');
    // Guards: a bare time (no zone), an unknown zone, and no time at all.
    assert(d('meet at 3pm', fixed) === null, 'bare time without a zone is skipped');
    assert(d('call me at 5', fixed) === null, 'no timezone → nothing');
    assert(d('total was 25 EST units', fixed) === null || !('25 EST' in (d('total was 25 EST units', fixed) || {})), 'out-of-range hour rejected');
    // Collision guards: lowercase ambiguous tokens and a common English word
    // must NOT be read as a timezone.
    assert(d('font size is 12pt today', fixed) === null, '"12pt" (font size) is not 12:00 PT');
    assert(d('turn 5 west then stop', fixed) === null, '"5 west" (direction) is not a time (WEST dropped)');
    assert(d('the 3 et al. authors', fixed) === null, 'lowercase "et" is not Eastern time');
    assert(d('call at 3 EST', fixed) === null, 'bare ambiguous hour (3am/3pm?) is skipped');
    // Same time, uppercase zone → converts; lowercase → left to the model.
    assert(d('9:00 PT sharp', fixed)['9:00 PT'] === '۱۹:۳۰', 'uppercase PT converts');
    assert(d('9:00 pt sharp', fixed) === null, 'lowercase pt does not convert');
    // Payload wiring: times attach per item only when present.
    const payload = GXT.prompt.buildItemsPayload([
      { text: 'stream at 8pm EDT tonight' },
      { text: 'no time here' },
    ]);
    assert(payload.items[0].times['8pm EDT'] === '۰۳:۳۰ (روز بعد)', 'EDT -4: 20:00 → 03:30 next day');
    assert(!('times' in payload.items[1]), 'no times hint when none present');
  });

  await t('generic prompt: schema + kind-aware anchors', async () => {
    const reqPage = GXT.prompt.buildGenericRequest(['Hello', 'World'], 'page', null);
    const reqSub = GXT.prompt.buildGenericRequest(['Hello'], 'subtitle', { thinkingLevel: 'minimal' });
    assert(reqPage.generationConfig.responseSchema.properties.t.type === 'array', 'schema t[]');
    assert(JSON.parse(reqPage.contents[0].parts[0].text).items[1] === '1⟫World', 'index-prefixed payload');
    const sysPage = reqPage.systemInstruction.parts[0].text;
    const sysSub = reqSub.systemInstruction.parts[0].text;
    assert(!sysPage.includes('Jalali date of day 1') && !sysSub.includes('Jalali date of day 1'),
      'anchor table removed from all generic prompts (token diet)');
    assert(sysPage.includes('⟫') && sysSub.includes('⟫'), 'indexed protocol survived the diet');
    assert(sysPage.length < 2200, 'generic prompt stays reasonable (' + sysPage.length + ' chars)');
    assert(reqPage.generationConfig.temperature === 0.25, 'deterministic temperature');
    assert(reqSub.generationConfig.thinkingConfig.thinkingLevel === 'minimal', 'thinking passthrough');
  });

  await t('v1.6.4: generic prompt quality pass + context element', async () => {
    assert(GXT.prompt.GENERIC_PROMPT_VERSION >= 5, 'generic version bumped to 5');
    const sub = GXT.prompt.buildGenericSystemPrompt('subtitle', GXT.prompt.nowContext());
    // Quality/discourse instructions present.
    assert(/consecutive parts of ONE document|read them all/i.test(sub), 'discourse-aware instruction');
    assert(/terminology consistent/i.test(sub), 'consistency instruction');
    assert(/context/i.test(sub), 'context element documented');
    assert(/spoken Persian/i.test(sub), 'subtitle spoken-register note');
    // Payload carries context separately from items, and only when present.
    const withCtx = GXT.prompt.buildGenericPayload(['a', 'b'], ['prev1', 'prev2']);
    assert(withCtx.items.length === 2 && withCtx.items[0] === '0⟫a', 'items prefixed');
    assert(Array.isArray(withCtx.context) && withCtx.context[0] === 'prev1', 'context attached');
    const noCtx = GXT.prompt.buildGenericPayload(['a'], null);
    assert(!('context' in noCtx), 'no context key when none given');
    const emptyCtx = GXT.prompt.buildGenericPayload(['a'], []);
    assert(!('context' in emptyCtx), 'empty context omitted');
    // buildGenericRequest threads context into the user turn.
    const req = GXT.prompt.buildGenericRequest(['x'], 'subtitle', null, ['ctxline']);
    assert(JSON.parse(req.contents[0].parts[0].text).context[0] === 'ctxline', 'request carries context');
  });

  await t('v1.6.4: context flows through gemini + openai translateTexts', async () => {
    const realFetch = globalThis.fetch;
    // Gemini
    globalThis.fetch = async (url, init) => {
      const payload = JSON.parse(JSON.parse(init.body).contents[0].parts[0].text);
      assert(payload.context && payload.context[0] === 'before', 'gemini payload carries context');
      return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: '{"t":["0⟫ب"]}' }] } }] }), { status: 200 });
    };
    try {
      const { list } = await GXT.gemini.translateTexts(['now'], { keys: ['k'], model: 'g', kind: 'subtitle', context: ['before'] });
      assert(list[0] === 'ب', 'gemini translated with context');
    } finally { globalThis.fetch = realFetch; }
    // OpenAI
    globalThis.fetch = async (url, init) => {
      const sent = JSON.parse(JSON.parse(init.body).messages.find((m) => m.role === 'user').content);
      assert(sent.context && sent.context[0] === 'before', 'openai payload carries context');
      return new Response(JSON.stringify({ choices: [{ message: { content: '{"t":["0⟫ب"]}' } }] }), { status: 200 });
    };
    try {
      const { list } = await GXT.openai.translateTexts(['now'], { key: 'k', model: 'm', baseUrl: 'https://api.test/v1', kind: 'subtitle', context: ['before'] });
      assert(list[0] === 'ب', 'openai translated with context');
    } finally { globalThis.fetch = realFetch; }
  });

  await t('parseGenericTranslations: indexed protocol roundtrip', async () => {
    const p = GXT.prompt.parseGenericTranslations;
    const out = p('{"t":["0⟫سلام","1⟫دنیا"]}', 2);
    assert(out[0] === 'سلام' && out[1] === 'دنیا', 'indexed roundtrip');
    // Order scrambled by the model: index wins, not position.
    const scrambled = p('{"t":["1⟫دوم","0⟫اول"]}', 2);
    assert(scrambled[0] === 'اول' && scrambled[1] === 'دوم', 'index beats position');
  });

  await t('REGRESSION (115/120 bug): dropped items self-heal, no misalignment', async () => {
    const p = GXT.prompt.parseGenericTranslations;
    // The model dropped item 1 out of 4 — before v1.2.1 this threw and the
    // whole batch (and eventually the feature) failed. Now: index-aligned
    // partial result with a null hole for the retry pass.
    const out = p('{"t":["0⟫الف","2⟫ج","3⟫د"]}', 4);
    assert(out[0] === 'الف', 'item 0 intact');
    assert(out[1] === null, 'dropped item is a null hole');
    assert(out[2] === 'ج' && out[3] === 'د', 'items AFTER the hole still aligned');
  });

  await t('parseGenericTranslations: unprefixed fallback + garbage', async () => {
    const p = GXT.prompt.parseGenericTranslations;
    // Model dropped the prefixes but returned one item per input: positional
    // alignment is safe.
    const out = p('{"t":["الف","ب"]}', 2);
    assert(out[0] === 'الف' && out[1] === 'ب', 'positional fallback when lengths match');
    // Unprefixed AND wrong length: nothing is trustworthy -> retriable throw.
    let threw = false;
    try { p('{"t":["فقط یکی"]}', 3); } catch (e) { threw = e.code === 'BAD_RESPONSE' && e.retriable; }
    assert(threw, 'unalignable response must throw retriable');
  });

  await t('v1.6: "N⟫" can never leak (merge / localized digits / residue)', async () => {
    const p = GXT.prompt.parseGenericTranslations;
    // Two items merged into one entry: split back apart by embedded prefix.
    const merged = p('{"t":["0⟫الف\\n1⟫ب"]}', 2);
    assert(merged[0] === 'الف' && merged[1] === 'ب', 'merged entry split by index: ' + JSON.stringify(merged));
    // Model localized the prefix digits to Persian: still recognized.
    const localized = p('{"t":["۰⟫سلام","۱⟫دنیا"]}', 2);
    assert(localized[0] === 'سلام' && localized[1] === 'دنیا', 'localized-digit prefix stripped');
    // Duplicate index lands in the positional fallback: prefix must not leak.
    const dup = p('{"t":["0⟫اول","0⟫دوم"]}', 2);
    assert(dup[0] === 'اول' && dup[1] === 'دوم', 'duplicate-index prefix stripped: ' + JSON.stringify(dup));
    // Multi-line item keeps its internal line breaks (no false split).
    const multi = p('{"t":["0⟫خط اول\\nادامهٔ همان خط"]}', 1);
    assert(multi[0] === 'خط اول\nادامهٔ همان خط', 'legit newline preserved');
    // Cache flush of previously-leaked entries.
    assert(GXT.prompt.GENERIC_PROMPT_VERSION >= 4, 'generic prompt version bumped');
  });

  await t('429 errors carry full unmasked diagnostics', async () => {
    const err = GXT.gemini._internal.classifyHttpError(429, {
      error: {
        message: 'You exceeded your current quota.',
        status: 'RESOURCE_EXHAUSTED',
        details: [
          { '@type': 'type.googleapis.com/google.rpc.RetryInfo', retryDelay: '41s' },
          {
            '@type': 'type.googleapis.com/google.rpc.QuotaFailure',
            violations: [{ quotaId: 'GenerateRequestsPerMinutePerProjectPerModel-FreeTier', quotaValue: '10' }],
          },
        ],
      },
    });
    assert(err.http === 429, 'http');
    assert(err.apiStatus === 'RESOURCE_EXHAUSTED', 'apiStatus');
    assert(err.raw.includes('exceeded'), 'raw message preserved');
    assert(err.quotaId.includes('PerMinute'), 'quotaId ' + err.quotaId);
  });

  await t('rotation failure exposes per-key attempts log', async () => {
    const realFetch = globalThis.fetch;
    const body429 = JSON.stringify({
      error: {
        message: 'Quota exceeded for this project.',
        status: 'RESOURCE_EXHAUSTED',
        details: [{ '@type': 'type.googleapis.com/google.rpc.RetryInfo', retryDelay: '60s' }],
      },
    });
    globalThis.fetch = async () => new Response(body429, { status: 429 });
    try {
      let caught = null;
      try {
        await GXT.gemini.translateBatch([{ text: 'x' }], { keys: ['AIzaKeyOne', 'AIzaKeyTwo'], model: 'gemini-att-test' });
      } catch (e) { caught = e; }
      assert(caught, 'must throw');
      assert(caught.code === 'RATE_LIMIT', 'code ' + caught.code);
      assert(caught.message.includes('همهٔ کلیدها'), 'aggregate message: ' + caught.message);
      const tried = (caught.attempts || []).filter((a) => a.code === 'RATE_LIMIT');
      assert(tried.length === 2, 'both keys attempted, got ' + tried.length);
      assert(tried[0].key === 'AIzaKeyOne' && tried[1].key === 'AIzaKeyTwo', 'keys unmasked in order');
      assert(tried[0].http === 429 && tried[0].apiStatus === 'RESOURCE_EXHAUSTED', 'attempt diagnostics');
    } finally { globalThis.fetch = realFetch; }
  });

  await t('gemini translateTexts (generic) end-to-end + hole passthrough', async () => {
    const realFetch = globalThis.fetch;
    globalThis.fetch = async (url, init) => {
      const body = JSON.parse(init.body);
      const payload = JSON.parse(body.contents[0].parts[0].text);
      assert(Array.isArray(payload.items) && payload.items[0].startsWith('0⟫'), 'payload.items index-prefixed');
      // Echo back indexed translations but DROP item 1 (model misbehavior).
      const t = payload.items
        .filter((s) => !s.startsWith('1⟫'))
        .map((s) => `${s.split('⟫')[0]}⟫سلام`);
      return new Response(
        JSON.stringify({ candidates: [{ content: { parts: [{ text: JSON.stringify({ t }) }] } }] }),
        { status: 200 }
      );
    };
    try {
      const { list } = await GXT.gemini.translateTexts(['hello', 'dropped', 'world'], { keys: ['kg1'], model: 'gemini-gen-test', kind: 'subtitle' });
      assert(list.length === 3, 'length preserved');
      assert(list[0] === 'سلام' && list[2] === 'سلام', 'translated items aligned');
      assert(list[1] === null, 'dropped item surfaces as null (worker retries it)');
    } finally { globalThis.fetch = realFetch; }
  });

  await t('openai translateTexts (generic) end-to-end', async () => {
    const realFetch = globalThis.fetch;
    globalThis.fetch = async (url, init) => {

      );

      GXT.gemini._internal.setRequestTimeoutMs(45000);
      GXT.gemini._internal.clearModelCooldown();

      globalThis.fetch = stalledFetch;

      ];
      // After the aborts fire the slots must free; a healthy request that

      await new Promise((r) => setTimeout(r, 600));
      globalThis.fetch = async () =>
        new Response(

      assert(map.get(0).t === 'سلام', 'a fresh request succeeds after the stalls timed out');

    } finally {

      GXT.gemini._internal.clearModelCooldown();

      const edge = host.style.getPropertyValue('--gxt-accent').trim();
      const worstCard = GXT.theme.compositeOver('#0b0d11', '#ffffff', 0.84);
      assert(

      );
      // The opacity control exists on the card and flips the persisted setting.

      toggle.click();

      toggle.click();

      let rect = card.el.getBoundingClientRect();
      assert(rect.left >= 0 && rect.top >= 0, 'clamped on screen: ' + rect.left + ',' + rect.top);
      // Drag: a pointerdown on the header followed by a move relocates it.
      // Parked first, so the assertion never depends on where it opened — a
      // card clamped against an edge cannot move further that way.
      card.el.style.left = '40px';
      card.el.style.top = '40px';
      const before = card.el.getBoundingClientRect().left;
      head.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, button: 0, clientX: rect.left + 20, clientY: rect.top + 10, pointerId: 1,
      }));
      window.dispatchEvent(new PointerEvent('pointermove', {
        bubbles: true, clientX: rect.left + 80, clientY: rect.top + 40, pointerId: 1,
      }));
      const after = card.el.getBoundingClientRect().left;
      assert(Math.round(after - before) === 60, 'header drag moves the card exactly (' + before + ' -> ' + after + ')');
      window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
      const parked = card.el.getBoundingClientRect().left;
      window.dispatchEvent(new PointerEvent('pointermove', {
        bubbles: true, clientX: rect.left + 300, clientY: rect.top + 40, pointerId: 1,
      }));
      assert(card.el.getBoundingClientRect().left === parked, 'drag stops on pointerup');
      // A failure renders with the full per-key diagnostics, not one line —

      // shadow root on the page and the page can read it. The full key stays

    } finally {

    }

    const a = UI.card({ title: 'a' });

  await t('v2.1.0 (item 5): urgent cues are scheduled ahead of the look-ahead', async () => {
    const S = GXT.yt._internal;
    // One cue per second for two minutes.
    const cues = Array.from({ length: 120 }, (_, i) => ({
      s: i * 1000, e: i * 1000 + 900, orig: 'line ' + i, fa: null,
    }));
    const done = new Set();
    const plan = (nowMs, paused) =>
      S.planBatch({
        list: cues, done, nowMs, paused,
        nearMs: 25000, nearBatch: 10, ahead: 90000, farBatch: 40,
      });
    // Nothing translated yet: the FIRST request covers the next few seconds
    // only — a small batch that lands fast — not a 40-cue prefetch.
    const first = plan(0, false);
    assert(first.length === 10, 'urgent batch is small, got ' + first.length);
    assert(first[0] === 0 && first[9] === 9, 'and starts at the playhead');
    for (const i of first) done.add(i);
    // The urgent horizon is still hungry, so the next request stays urgent.
    const second = plan(0, false);
    assert(second.length === 10 && second[0] === 10, 'second urgent batch continues');
    for (const i of second) done.add(i);
    // Once the near window is covered, the look-ahead takes over with a big
    // batch — the part that must never block the urgent one.
    for (let i = 20; i <= 25; i += 1) done.add(i);
    const far = plan(0, false);
    assert(far.length === 40, 'look-ahead batch is large, got ' + far.length);
    assert(far[0] === 26, 'and picks up after the covered region');
    // PAUSED: the urgent window is still served (a frozen frame shows a cue
    // that may be untranslated — the exact "I have to pause and wait" report),
    // but the look-ahead is not, so a paused video burns no quota.
    assert(plan(0, true) === null, 'paused + near window covered = nothing');
    done.delete(5);
    const pausedPlan = plan(0, true);
    assert(pausedPlan && pausedPlan[0] === 5, 'paused still fills the urgent window');
    // A seek far ahead schedules from the NEW position, not from the start.
    const seeked = plan(60000, false);
    assert(seeked[0] >= 59, 'seek schedules at the playhead, got ' + seeked[0]);
    // Already-translated cues are never re-requested.
    cues[70].fa = 'ترجمه';
    const after = S.planBatch({
      list: cues, done: new Set(), nowMs: 70000, paused: false,
      nearMs: 25000, nearBatch: 10, ahead: 90000, farBatch: 40,
    });
    assert(!after.includes(70), 'translated cue skipped');
    // Binary search agrees with a linear scan at a few probes.
    for (const ms of [0, 1, 45000, 119999, 999999]) {
      const found = cues.findIndex((c) => c.e >= ms);
      const expected = found === -1 ? cues.length : found;
      assert(S.cueIndexAt(cues, ms) === expected, 'cueIndexAt at ' + ms);
    }
  });

    const S = GXT.tts.split;
    assert(S('').length === 0, 'empty in, empty out');
    assert(S('سلام دنیا').length === 1, 'short text is one piece');

    // Persian punctuation must actually split. A paragraph broken only on «.»
    // would barely split at all — «؟» and «؛» carry most Persian sentences.
    const persian = 'این جملهٔ اول است؟ ' + 'و این جملهٔ دوم است؛ '.repeat(30) + 'پایان.';
    const parts = S(persian);
    assert(parts.length > 1, 'long Persian text splits, got ' + parts.length);
    // Time-to-first-word: the opening piece is deliberately short.
    assert(parts[0].length <= GXT.tts._internal.FIRST_CHUNK, 'first piece small: ' + parts[0].length);
    for (const p of parts) assert(p.length <= GXT.tts._internal.HARD_MAX, 'piece within hard max');
    // Nothing may be lost: every word of the source survives, in order.
    const words = (s) => s.replace(/\s+/g, ' ').trim().split(' ');
    assert(words(parts.join(' ')).join(' ') === words(persian).join(' '), 'no text lost or reordered');

    // A single un-punctuated run longer than the hard max still breaks at
    // spaces, never inside a word.
    const runOn = 'کلمه '.repeat(600).trim();
    for (const p of S(runOn)) {
      assert(!/^\S*ه\S/.test(p) || p.startsWith('کلمه'), 'no word was cut in half');
      assert(p.split(' ').every((w) => w === 'کلمه'), 'every token intact: ' + p.slice(0, 30));
    }
  });

    // …but a lost style tag is better dropped than duplicated somewhere wrong.
    assert(!detokenize('⟦0⟧الف⟦1⟧', tokens).includes('<i>'), 'lost style tag not resurrected mid-line');
    // Out-of-range or garbage indexes must vanish, not print as ⟦9⟧. Checked
    // against a break-free token list so the line-break rescue above cannot
    // mask the result.
    const styleOnly = tokenize('<i>x</i>').tokens;
    assert(detokenize('⟦9⟧الف', styleOnly) === 'الف', 'bad index dropped: ' + detokenize('⟦9⟧الف', styleOnly));
    assert(detokenize('⟦abc⟧الف', styleOnly) === '⟦abc⟧الف', 'non-numeric is not a token at all');

    assert(detokenize('⟦ 0 ⟧الف', tokens).startsWith('{\\an8}'), 'spaced token healed');
  });

    const { pickRate } = D();

    assert(pickRate({ chars: 20, availableMs: 2000 }) === 1, 'already fits ⇒ natural pace');

    assert(tight > 1.2 && tight <= 1.3, 'speeds up to fit, got ' + tight);

    // must ask for the SAME rate, or it misses the audio cache every time.

    // Identical clips, differing only in the rate they were rendered at. A

    // teach the model 60 ms/char — not 40. Without undoing the rate, every

  /** A fetch stand-in, so the client can be tested with no bridge running. */
  function fakeFetch(plan) {
    return async (url, init) => {
      fakeFetch.calls.push({ url, init });
      if (plan.throw) throw plan.throw;
      const body = plan.body === undefined ? {} : plan.body;
      return {
        ok: plan.status ? plan.status < 400 : true,
        status: plan.status || 200,
        headers: { get: (name) => (name === 'Content-Type' ? (plan.mime || 'application/json') : null) },
        json: async () => body,
        arrayBuffer: async () => plan.buffer || new ArrayBuffer(0),
      };
    };
  }

  const withFetch = async (plan, fn) => {
    const real = globalThis.fetch;
    fakeFetch.calls = [];
    globalThis.fetch = fakeFetch(plan);
    try { return await fn(); } finally { globalThis.fetch = real; }
  };

    // Comments are stripped first: the prose in that file legitimately quotes
    // the literals it replaced, and an audit that reads comments would force
    // the explanation of a fix to be deleted along with the bug.
    const bare = css.replace(/\/\*[\s\S]*?\*\//g, '');

    assert(magic.length === 0, `the player UI still hard-codes ${magic.length} font size(s): ${magic.join(', ')}`);
    // v3.2.5 — the caption and the callout joined the design system.

    const { looksLikePage } = GXT.manga._internal;

      for (const [k, v] of Object.entries(attrs.attrs || {})) img.setAttribute(k, v);
      // naturalWidth/Height are read-only, so the test stands them up the way

      Object.defineProperty(img, 'naturalWidth', { value: attrs.w ?? 0, configurable: true });
      Object.defineProperty(img, 'naturalHeight', { value: attrs.h ?? 0, configurable: true });
      const host = document.createElement(parentTag || 'div');
      host.appendChild(img);
      document.body.appendChild(host);
      return { img, host };
    };

    assert(looksLikePage(page.img), 'a normal page');

    assert(!looksLikePage(banner.img), 'a wide banner is not a page');

    // (only successes land in `translated`/`originals`), so each scan saw it as

    // costs a hint token on every future request.

    for (const bad of ['the', 'The', 'a', 'https://x.com', '@user', '2026',

      assert(!M.isCandidate(bad, { midSentence: true }), `should NOT remember «${bad}»`);

    assert(memory.terms['set up a meeting']?.pinned, 'manual lowercase phrase was discarded by auto-learning heuristic');
    await GXT.mergeMemory({ terms: {
      'set up a meeting': { s: 'set up a meeting', t: 'نادرست', n: 1, at: Date.now() + 1000 },
      studio: { s: 'Studio', t: 'استودیو', n: 9999, at: 1, pinned: true },
    } });
    memory = await GXT.getMemory();
    assert(memory.terms['set up a meeting'].t === 'جلسه‌ای ترتیب بده', 'import overwrote the user correction');
    assert(memory.terms.studio.pinned, 'import lost the pinned flag');
    const update = GXT.updateMemory(async (current) => {
      await new Promise((r) => setTimeout(r, 5));
      return current;
    });
    const clear = GXT.clearMemory();
    await Promise.all([update, clear]);
    assert((await GXT.getMemory()).count === 0, 'pending memory writer resurrected cleared terms');
  });

  await t('audit: keyless backups redact bridge credentials and reject broken setting types', async () => {
    const saved = await GXT.getSettings();
    try {
      await GXT.setSettings({ bridgeToken: 'TEST-BRIDGE-CREDENTIAL' });
      const clean = await GXT.exportBackup({ includeKeys: false });
      assert(!JSON.stringify(clean).includes('TEST-BRIDGE-CREDENTIAL'), 'bridge token leaked into keyless backup');
      const explicit = await GXT.exportBackup({ includeKeys: true });
      assert(explicit.settings.bridgeToken === 'TEST-BRIDGE-CREDENTIAL', 'explicit credential backup lost the bridge token');
      const result = await GXT.importBackup({ format: 'tarjoman-backup', version: 1,
        settings: { model: {}, batchSize: 'broken', enabled: null, register: 'formal' } });
      assert(result.settings === 1 && result.skipped === 3, 'malformed setting types were imported');
    } finally { await GXT.setSettings(saved); }
  });

  // Execute the production worker handlers with controlled provider/storage
  // boundaries. This covers cache and lifecycle behavior that module-only
  // tests miss without making a paid request or using real profile data.
  const workerAuditSource = await (await fetch('../background/service-worker.js?audit=' + Date.now())).text();
  await t('audit: generic translation keeps styles, quality and dialogue caches separate', async () => {
    const sharing = workerAuditSource.includes('function translationFlightKey(')
      ? workerAuditSource.slice(workerAuditSource.indexOf('function translationFlightKey('), workerAuditSource.indexOf('function persistFallback(')) : '';
    const source = 'let translationSettingsGeneration = 0;\n' + sharing + workerAuditSource.slice(workerAuditSource.indexOf('async function handleTranslateTexts('),
      workerAuditSource.indexOf('const MENU ='));
    const stored = new Map();
    let calls = 0, reviews = 0;
    const settings = { ...GXT.DEFAULTS, provider: 'openai', qualityMode: true };
    const ctx = { configured: true, isGemini: false, cacheId: 'audit-provider',
      translateTexts: async (texts, kind, context) => {
        calls += 1;
        return { list: texts.map((text) => `${kind}:${context?.[0] || ''}:${text}`), model: 'audit-model' };
      },
      reviewTexts: async (texts) => { reviews += 1; return { list: texts.map((s) => 'edited:' + s) }; },
    };
    const bg = { ...GXT, getSettings: async () => settings,
      cache: { keyFor: GXT.cache.keyFor, generation: () => 0, coalesce: GXT.cache.coalesce,
        getMany: async (keys) => Object.fromEntries(keys.filter((k) => stored.has(k)).map((k) => [k, stored.get(k)])),
        setMany: async (pairs) => { for (const [key, value] of pairs) stored.set(key, value); },
      },
    };
    const run = new Function('GXTBG', 'getProviderCtx', 'attachMemory', 'learnFrom', 'bumpStats',
      'noteLearnedDailyLimit', 'errorDetail', 'scrub', source + '\nreturn handleTranslateTexts;')(
      bg, async () => ctx, async () => {}, () => {}, () => {}, () => {}, () => ({}), String);
    const live = await run({ texts: ['That is right.'], kind: 'subtitle', context: ['Direction'] });
    const same = await run({ texts: ['That is right.'], kind: 'subtitle', context: ['Direction'] });
    assert(calls === 1 && same.list[0] === live.list[0], 'identical request missed cache');
    const file = await run({ texts: ['That is right.'], kind: 'subtitle', context: ['Direction'], quality: true });
    assert(calls === 2 && reviews === 1 && file.list[0].startsWith('edited:'), 'reviewed export reused a live draft');
    await run({ texts: ['That is right.'], kind: 'page', context: ['Direction'] });
    assert(calls === 3, 'page prompt reused subtitle output');
    const context = await run({ texts: ['That is right.'], kind: 'subtitle', context: ['Correctness'] });
    assert(calls === 4 && context.list[0].includes('Correctness'), 'dialogue context reused unrelated meaning');
    let pass = 0;
    ctx.translateTexts = async () => ({ list: [++pass === 1 ? '   ' : 'بازیابی'], model: 'audit-model' });
    const recovered = await run({ texts: ['retry whitespace'], kind: 'subtitle' });
    assert(pass === 2 && recovered.list[0] === 'بازیابی', 'blank model output was cached as success');
  });

  await t('audit: Live start-stop-start discards stale startup and recovers from settings failure', async () => {
    const source = workerAuditSource.slice(workerAuditSource.indexOf('chrome.runtime.onConnect.addListener'),
      workerAuditSource.indexOf('const EXTENSION_ONLY_MESSAGES'));
    let connected, receive, disconnect, release;
    const messages = [], sessions = [];
    let reads = 0;
    const bg = { getSettings: async () => {
      reads += 1;
      if (reads === 1) return new Promise((r) => { release = () => r({}); });
      if (reads === 3) throw new Error('settings unavailable');
      return {};
    }, getApiKeys: async () => ['TEST-ONLY'], MODEL_LIST_KEY:'modelList', classifyModels:()=>({live:[]}), live: {
      createSession: () => { const session = { starts: 0, stops: 0,
        start() { this.starts += 1; }, stop() { this.stops += 1; }, push() {},
      }; sessions.push(session); return session; },
    } };
    const chrome = { storage:{local:{get:async()=>({})}}, runtime: { id: 'audit-extension', onConnect: { addListener: (fn) => { connected = fn; } } } };
    new Function('chrome', 'GXTBG', 'scrub', source)(chrome, bg, String);
    connected({ name: 'gxt-live', sender: { id: 'audit-extension' }, postMessage: (m) => messages.push(m),
      onMessage: { addListener: (fn) => { receive = fn; } },
      onDisconnect: { addListener: (fn) => { disconnect = fn; } },
    });
    const stale = receive({ t: 'start' });
    await receive({ t: 'stop' });
    await receive({ t: 'start' });
    release(); await stale;
    assert(sessions.length === 1 && sessions[0].starts === 1, 'cancelled startup created an orphan Live socket');
    await receive({ t: 'stop' });
    await receive({ t: 'start' });
    assert(messages.some((m) => m.state === 'error'), 'settings rejection left startup silent');
    await receive({ t: 'start' });
    assert(sessions.length === 2, 'failed startup wedged the start guard');
    disconnect();
    assert(sessions.every((s) => s.stops === 1), 'disconnect did not stop every owned session');
  });

  await t('audit: privileged worker messages require the extension page origin', async () => {
    const source = workerAuditSource.slice(workerAuditSource.indexOf('const EXTENSION_ONLY_MESSAGES'),
      workerAuditSource.indexOf('// ------------------------------------------------------------------- badge'));
    let listener, calls = 0;
    const chrome = { runtime: { id: 'audit-extension', getURL: () => 'chrome-extension://audit-extension/',
      onMessage: { addListener: (fn) => { listener = fn; } },
    } };
    new Function('chrome', 'handlers', 'scrub', source)(chrome, {
      EXPORT_BACKUP: async () => { calls += 1; return { ok: true }; },
      TRANSLATE_TEXTS: async () => { calls += 1; return { ok: true }; },
    }, String);
    const send = (type, sender) => new Promise((r) => listener({ type }, sender, r));
    const content = { id: 'audit-extension', url: 'https://www.youtube.com/watch?v=test' };
    assert((await send('EXPORT_BACKUP', content)).code === 'FORBIDDEN', 'content script could export credentials');
    assert((await send('TRANSLATE_TEXTS', content)).ok, 'normal content translation blocked');
    assert((await send('EXPORT_BACKUP', { id: 'audit-extension', url: 'chrome-extension://audit-extension/popup/popup.html' })).ok,
      'popup lost backup access');
    assert((await send('TRANSLATE_TEXTS', { id: 'other-extension', url: content.url })).code === 'FORBIDDEN', 'foreign sender accepted');
    assert((await send('constructor', content)).code === 'UNKNOWN_TYPE', 'inherited property treated as a handler');
    assert(calls === 2, 'a blocked message executed its handler');
  });

  await t('audit: stalled response bodies time out and release MT and speech slots', async () => {
    const originalFetch = globalThis.fetch;
    GXT.mt._internal.setRequestTimeoutMs(80);
    GXT.tts._internal.setRequestTimeoutMs(80);
    GXT.mt.bingSession.reset();
    globalThis.fetch = async (url, options) => {
      if (String(url).includes('bing.com/translator')) return { ok: true, status: 200,
        text: async () => 'IG:"TEST" data-iid="tr.1" params_AbusePreventionHelper = [1700000000,"test",3600000];',
      };
      const stalledBody = () => new Promise((_, reject) => {
        options.signal.addEventListener('abort', () => reject(new DOMException('Aborted', 'AbortError')));
      });
      return { ok: true, status: 200, json: stalledBody, text: stalledBody, arrayBuffer: stalledBody };
    };
    let timer;
    try {
      const requests = [
        GXT.mt.translateTexts(['source'], { engine: 'google' }),
        GXT.mt.translateTexts(['source'], { engine: 'bing' }),
        GXT.tts.speak('سلام', { engine: 'bing', voice: 'fa-IR-DilaraNeural', rate: 1 }),
        GXT.tts.speak('سلام', { engine: 'openai', voice: 'alloy', model: 'test', baseUrl: 'https://tts.test/v1' }),
      ].map((request) => request.then(() => null, (error) => error));
      const results = await Promise.race([
        Promise.all(requests),
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('body read hung')), 1800); }),
      ]);
      assert(results.every((error) => error?.code === 'TIMEOUT'), 'stalled body lost timeout classification');
      assert(GXT.mt._internal.limiter.active === 0 && GXT.tts._internal.limiter.active === 0,
        'body timeout left limiter slots occupied');
      globalThis.fetch = async () => ({ ok: true, json: async () => [[['بازیابی']], null, 'en'] });
      assert((await GXT.mt.translateTexts(['source'], { engine: 'google' })).list[0] === 'بازیابی',
        'translation did not recover after body timeout');
    } finally {
      clearTimeout(timer);
      globalThis.fetch = originalFetch;
      GXT.mt._internal.setRequestTimeoutMs(20000);
      GXT.tts._internal.setRequestTimeoutMs(60000);
      GXT.mt.bingSession.reset();
    }
  });

  await t('audit: exhausted Gemini model does not disable another model using the same key', async () => {
    const originalFetch = globalThis.fetch;
    let calls = 0;
    const key = 'audit-model-key';
    globalThis.fetch = async (url) => {
      calls += 1;
      if (String(url).includes('audit-limited')) return new Response(JSON.stringify({ error: {
        message: 'quota exceeded', details: [{ '@type': 'type.googleapis.com/google.rpc.QuotaFailure',
          violations: [{ quotaId: 'GenerateRequestsPerDayPerProjectPerModel', quotaValue: '5' }],
        }],
      } }), { status: 429 });
      return new Response(JSON.stringify({ candidates: [{ content: { parts: [
        { text: '{"r":[{"i":0,"t":"سالم","sl":"en"}]}' },
      ] } }] }), { status: 200 });
    };
    try {
      let error;
      try { await GXT.gemini.translateBatch([{ text: 'source' }], { keys: [key], model: 'audit-limited' }); }
      catch (e) { error = e; }
      assert(error?.code === 'RATE_LIMIT', 'daily quota was not classified');
      const healthy = await GXT.gemini.translateBatch([{ text: 'source' }], { keys: [key], model: 'audit-healthy' });
      assert(healthy.map.get(0)?.t === 'سالم' && calls === 2, 'a different model inherited the exhausted quota');
      assert((await GXT.gemini.keySnapshot([key], 'audit-limited')).usable === 0, 'limited model forgot its cooldown');
      assert((await GXT.gemini.keySnapshot([key], 'audit-healthy')).usable === 1, 'healthy model status is wrong');
    } finally {
      globalThis.fetch = originalFetch;
      GXT.gemini._internal.keyState.delete(key);
    }
  });

  await t('audit: Gemini quota counters remain isolated when switching models', async () => {
    const source = workerAuditSource.slice(workerAuditSource.indexOf('async function getKeyUsage('),
      workerAuditSource.indexOf('// gemini.js reports;'));
    const bg = { ...GXT, KEY_USAGE_KEY: 'auditModelUsage' };
    const api = new Function('GXTBG', 'chrome', 'let statsQueue = Promise.resolve();\n' + source +
      '\nreturn { getKeyUsage, bumpKeyUsage };')(bg, chrome);
    await api.bumpKeyUsage({ key: 'test-key', model: 'model-a', kind: 'call' });
    await api.bumpKeyUsage({ key: 'test-key', model: 'model-a', kind: 'exhausted', limit: 5 });
    await api.bumpKeyUsage({ key: 'test-key', model: 'model-b', kind: 'call' });
    const a = (await api.getKeyUsage('model-a')).keys['test-key'];
    const b = (await api.getKeyUsage('model-b')).keys['test-key'];
    assert(a.exhausted && a.limit === 5 && a.calls === 1, 'model A lost its measured limit');
    assert(!b.exhausted && b.calls === 1 && !b.limit, 'model B inherited model A exhaustion/calls');
    await chrome.storage.local.remove('auditModelUsage');
  });

  await t('audit: settings mutations from separate document contexts share one worker queue', async () => {
    const source = await (await fetch('../shared/settings.js?audit=' + Date.now())).text();
    const state = { settings: { ...GXT.DEFAULTS, enabled: true, ytDub: false } };
    const storage = { local: {
      get: async () => structuredClone(state),
      set: async (patch) => { Object.assign(state, structuredClone(patch)); },
    }, onChanged: { addListener() {} } };
    let handlers, messages = 0;
    const makeRealm = (isDocument) => {
      const scope = {};
      const api = { storage, runtime: { getURL: () => 'chrome-extension://audit-extension/',
        sendMessage: async (message) => { messages += 1; return handlers[message.type](message); },
      } };
      new Function('globalThis', 'chrome', 'document', source)(scope, api, isDocument ? {} : undefined);
      return scope.GXT;
    };
    const worker = makeRealm(false);
    const handlerSource = workerAuditSource.slice(workerAuditSource.indexOf('const handlers = {'),
      workerAuditSource.indexOf('  TRANSLATE_BATCH: handleTranslateBatch,')) + '\n}; return handlers;';
    handlers = new Function('GXTBG', handlerSource)(worker);
    const first = makeRealm(true), second = makeRealm(true);
    await Promise.all([first.setSettings({ enabled: false }), second.setSettings({ ytDub: true })]);
    assert(state.settings.enabled === false && state.settings.ytDub === true && messages === 2,
      'concurrent popup/tab writes lost an independent setting');
    await Promise.all([
      first.setSiteSetting('https://one.test', 'register', 'formal'),
      second.setSiteSetting('https://two.test', 'qualityMode', true),
    ]);
    assert(state.settings.sitePrefs['https://one.test'].register === 'formal' &&
      state.settings.sitePrefs['https://two.test'].qualityMode === true, 'site profile writes raced');
    let rejected = false;
    try { await first.setSettings({ model: {} }); } catch { rejected = true; }
    assert(rejected && typeof state.settings.model === 'string', 'invalid worker reply caused a local overwrite');
    const before = structuredClone(state);
    const original = storage.local.set;
    storage.local.set = async () => { throw new Error('storage failure'); };
    try { await second.setSettings({ enabled: true }); } catch { rejected = true; }
    storage.local.set = original;
    assert(JSON.stringify(before) === JSON.stringify(state), 'failed worker write fell back to racing local storage');
    await first.setSettings({ enabled: true });
    assert(state.settings.enabled, 'one failed storage write wedged the worker queue');
  });

  out.replaceChildren();
  for (const [name, ok, msg] of results) {
    const div = document.createElement('div');
    div.className = ok ? 'pass' : 'fail';
    div.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}${msg ? ' — ' + msg : ''}`;
    out.appendChild(div);
    console.log(`GXT-SELFTEST ${ok ? 'PASS' : 'FAIL'} ${name}${msg ? ' — ' + msg : ''}`);
  }

  console.log(`GXT-SELFTEST SUMMARY ${results.filter((r) => r[1]).length}/${results.length}`);
})();
</script>
</body>
