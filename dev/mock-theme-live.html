<!doctype html><meta charset="utf-8"><title>Live appearance and video settings regressions</title>
<iframe src="popup-preview.html?audit=1" width="470" height="800"></iframe>
<script>
(async()=>{
  const frame=document.querySelector('iframe'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const until=async fn=>{for(let i=0;i<250;i++){if(await fn())return;await sleep(16);}throw Error('condition timeout');};
  await until(()=>frame.contentWindow.__popupReady);
  const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),G=w.GXT,T=G.theme;
  let passed=0,total=0;
  async function test(name,fn){total++;try{if(!await fn())throw Error('contract failed');passed++;console.log('GXT-THEME-LIVE PASS '+name);}catch(e){console.log('GXT-THEME-LIVE FAIL '+name+' '+e.message);}}
  const token=key=>d.documentElement.style.getPropertyValue('--gxt-'+key).trim();
  const choose=id=>{const index=T.PRESETS.findIndex(p=>p.id===id);$('presetGrid').querySelectorAll('button')[index].click();};
  const change=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
  $('appearanceBtn').click();
  await test('all new appearance controls are mounted and explicitly labelled',()=>['uiRadius','uiOpacity','uiBlur','uiScale','uiWeight','uiMotionSpeed','uiButtonShape','uiPanelStyle','uiCustomAccent','uiBackground'].every(id=>$(id)&&d.querySelector(`label[for="${id}"]`)));
  await test('a preset changes the existing popup geometry immediately',async()=>{choose('matte');const radius=token('radius-md');await until(async()=>(await G.getSettings()).uiPreset==='matte');return radius==='4px'&&token('elev-3')==='none';});
  await test('forty rapid preset choices finish on the last intent',async()=>{for(let i=0;i<40;i++)choose(i%2?'oled':'soft');choose('future');await until(async()=>(await G.getSettings()).uiPreset==='future');return d.documentElement.dataset.preset==='future'&&token('radius-md')==='2px';});
  await test('manual radius control changes the live popup and persists',async()=>{change('uiRadius','20');await until(async()=>(await G.getSettings()).uiRadius===20);return token('radius-md')==='20px'&&d.documentElement.dataset.preset==='custom';});
  await test('manual control shape affects the rendered switch independently',async()=>{change('uiSwitchShape','square');await until(async()=>(await G.getSettings()).uiSwitchShape==='square');return w.getComputedStyle($('showHints').nextElementSibling).borderRadius==='4px';});
  await test('external settings writes re-theme the already open popup',async()=>{await G.setSettings({uiTheme:'paper',uiRadius:7,uiPreset:'custom'});await until(()=>token('radius-md')==='7px');return d.documentElement.dataset.theme==='paper';});
  await test('rapid external A to B to A changes settle on the latest geometry',async()=>{await Promise.all([G.setSettings({uiRadius:1}),G.setSettings({uiRadius:25}),G.setSettings({uiRadius:1})]);return token('radius-md')==='1px'&&$('uiRadius').value==='1';});
  await test('reset restores every appearance field without touching video preference',async()=>{await G.setSettings({videoSafeUi:false,uiCustomAccent:'#ffcc00',uiTextScale:1.25});$('resetAppearance').click();await until(async()=>(await G.getSettings()).uiCustomAccent==='');const s=await G.getSettings();return Object.entries(T.resetSettings()).every(([k,v])=>s[k]===v)&&s.videoSafeUi===false;});
  await test('nullable overrides pass production settings validation',()=>G.isSettingValue('uiRadius',null)&&G.isSettingValue('uiRadius',15)&&!G.isSettingValue('uiRadius',Infinity)&&!G.isSettingValue('uiRadius','15'));
  await test('advanced motion reduction disables rendered transitions',async()=>{change('uiMotion','reduce');await until(async()=>(await G.getSettings()).uiMotion==='reduce');return token('dur-2')==='0ms'&&w.getComputedStyle($('showHints').nextElementSibling).transitionDuration==='0s';});
  await test('selecting a stock accent clears an earlier custom color',async()=>{await G.setSettings({uiCustomAccent:'#ff00ff'});$('accentRow').querySelector('button').click();await until(async()=>(await G.getSettings()).uiCustomAccent==='');return token('accent-brand')===T.ACCENTS[0].color;});
  await test('solid surface and reduced motion visibly disable irrelevant knobs',async()=>{await G.setSettings({uiSurface:'solid',uiMotion:'reduce'});return $('uiOpacity').disabled&&$('uiBlur').disabled&&$('uiMotionSpeed').disabled;});
  await test('a permission refusal leaves general video disabled',async()=>{const old=w.chrome.permissions.request;w.chrome.permissions.request=async()=>false;try{$('webVideoEnabled').checked=true;$('webVideoEnabled').dispatchEvent(new w.Event('change'));await until(()=>!$('webVideoEnabled').disabled);return !(await G.getSettings()).webVideoEnabled&&!$('webVideoEnabled').checked;}finally{w.chrome.permissions.request=old;}});
  await test('permission precedes persisted video enable and covers HTTP and HTTPS',async()=>{const old=w.chrome.permissions.request;let requested=null,before;w.chrome.permissions.request=args=>{requested=args;before=$('webVideoEnabled').checked;return Promise.resolve(true);};try{$('webVideoEnabled').checked=true;$('webVideoEnabled').dispatchEvent(new w.Event('change'));await until(()=>!$('webVideoEnabled').disabled);return before&&requested.origins.join(',')==='http://*/*,https://*/*'&&(await G.getSettings()).webVideoEnabled;}finally{w.chrome.permissions.request=old;}});
  await test('site lists normalize domains and reject unsafe non-domain values',async()=>{change('webVideoBlockedSites','https://example.com\nEXAMPLE.ORG');await until(async()=>(await G.getSettings()).webVideoBlockedSites.length===2);change('webVideoBlockedSites','https://example.com/private');await sleep(40);return (await G.getSettings()).webVideoBlockedSites.join(',')==='example.com,example.org'&&$('webVideoStatus').textContent.includes('دامنه');});
  await test('concurrent quick site actions preserve both block entries',async()=>{await G.setSettings({webVideoBlockedSites:[]});await Promise.all([G.setWebVideoSiteBlocked('one.example',true),G.setWebVideoSiteBlocked('two.example',true)]);return (await G.getSettings()).webVideoBlockedSites.sort().join(',')==='one.example,two.example';});
  await test('unblocking a selected-only site also admits it atomically',async()=>{await G.setSettings({webVideoSiteMode:'allowlist',webVideoAllowedSites:[],webVideoBlockedSites:['one.example']});await G.setWebVideoSiteBlocked('one.example',false);const s=await G.getSettings();return !s.webVideoBlockedSites.includes('one.example')&&s.webVideoAllowedSites.includes('one.example');});
  await test('YouTube model and target controls persist independent overrides',async()=>{change('ytProvider','openai');change('ytModel','dedicated-model');change('ytTargetLang','ja');await until(async()=>(await G.getSettings()).ytTargetLang==='ja');const s=G.youtubeSettings(await G.getSettings());return s.provider==='openai'&&s.openaiModel==='dedicated-model'&&s.ytTargetLang==='ja';});
  await new Promise((resolve,reject)=>{const script=d.createElement('script');script.src='../content/ui.js';script.onload=resolve;script.onerror=reject;d.body.append(script);});
  await test('existing shadow surface follows tokens without replacing its controls',async()=>{G.ui.configure({...G.DEFAULTS,uiTheme:'graphite'});const surface=G.ui.surface(d.body,{id:'theme-live'});const button=G.ui.button('test');surface.root.append(button);const old=button;G.ui.configure({...G.DEFAULTS,...T.presetSettings('future')});const result=surface.host.style.getPropertyValue('--gxt-radius-md').trim()==='2px'&&surface.root.contains(old)&&surface.host.style.getPropertyValue('--gxt-backdrop').trim()==='none';G.ui.dropSurface('theme-live');return result;});
  await test('two hundred surface and theme cycles leave no orphan style or host nodes',()=>{const count=d.querySelectorAll('[data-gxt-ui]').length;for(let i=0;i<200;i++){const s=G.ui.surface(d.body,{id:'theme-cycle'});G.ui.configure({...G.DEFAULTS,...T.presetSettings(T.PRESETS[i%T.PRESETS.length].id)});if(s.root.querySelectorAll('style').length!==1)return false;G.ui.dropSurface('theme-cycle');}return d.querySelectorAll('[data-gxt-ui]').length===count;});
  console.log(`GXT-THEME-LIVE SUMMARY ${passed}/${total}`);
})().catch(error=>console.error(error));
</script>
