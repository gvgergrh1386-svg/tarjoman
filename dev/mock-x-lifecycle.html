<script>
globalThis.GXT_SHIM_SEED = { settings: { enabled: false, batchSize: 1, batchDelayMs: 1 }, apiKeys: ['test-only'] };
const NativeIntersectionObserver = globalThis.IntersectionObserver;
const nativeEntries = [];
globalThis.IntersectionObserver = class {
  constructor(callback, options) {
    this.callback = callback; this.targets = new Set();
    this.native = new NativeIntersectionObserver((entries) => { nativeEntries.push(...entries); callback(entries); }, options);
  }
  observe(el) {
    if (el.dataset.nativeIo) return this.native.observe(el);
    this.targets.add(el);
    setTimeout(() => {
      if (this.targets.has(el)) this.callback([{ target: el, isIntersecting: true, intersectionRatio: 1 }]);
    }, 0);
  }
  unobserve(el) { this.targets.delete(el); this.native.unobserve(el); }

};
const sent = [], routes = new Map();
let composeRoute = null, imageRoute = null;
globalThis.GXT_SHIM_HANDLER = async (message) => {
  sent.push(message);
  if(message.type==='TTS_SPLIT')return{ok:true,parts:[message.text]};
  if (message.type === 'TRANSLATE_COMPOSE') return composeRoute ? composeRoute(message) : { ok: true, t: 'Translated draft' };
  if (message.type === 'TRANSLATE_IMAGE') return imageRoute ? imageRoute(message) : { ok: true, t: 'ترجمهٔ تصویر' };
  if (message.type !== 'TRANSLATE_BATCH') return { ok: false, code: 'DEV' };
  const results = {};
  for (const item of message.items) {
    const result = routes.has(item.text) ? await routes.get(item.text)(item) : { ok: true, t: 'فارسی ' + item.text, sl: 'en' };
    if (result.batch) return result.batch;
    results[item.id] = result;
  }
  return { ok: true, results };
};

  routes.set(text, () => promise);

}

  let resolve; const promise = new Promise((r) => { resolve = r; });

}

        postMessage(message){if(!message.items)return;requests.push(message.items);const emit=m=>{if(!closed)listeners.forEach(f=>f(m));};

            const cached=message.items.find(i=>i.text.startsWith('Cached before reconnect'));
            setTimeout(()=>{emit({t:'result',id:cached.id,result:{ok:true,t:'ترجمهٔ کش',sl:'en',cached:true}});close();},20);
          } else reconnectResult=()=>{for(const item of message.items)emit({t:'result',id:item.id,result:{ok:true,t:'ترجمهٔ پس از اتصال',sl:'en'}});};
        }};
    };

      await settings({enabled:true,batchSize:8,batchDelayMs:30});const old=tweet('Cached before reconnect example.'),fresh=tweet('Unfinished after reconnect example.');

      await until(()=>reconnectResult,'unfinished post was not reconnected',5000);
      assert(requests[1].length===1&&requests[1][0].text===fresh.textContent,'reconnect resubmitted a completed post');

  }],

(async () => {
  tests.push(['stopping X read-aloud aborts pending synthesis without a late error',async()=>{
    const original=GXT.requestXAction,states=[];let signal;
    GXT.requestXAction=(message,owner)=>{signal=owner;return new Promise(resolve=>owner.addEventListener('abort',()=>resolve({ok:false,code:'CANCELLED'}),{once:true}));};
    try {
      const speech=GXT.ui.speak('A source waiting for speech.',{onState:state=>states.push(state)});
      await until(()=>signal,'speech did not start');speech.stop();await sleep(30);
      assert(signal.aborted,'speech owner did not cancel');assert(states.at(-1)==='idle'&&!states.includes('error'),'cancel was rendered as failure');
    } finally {GXT.ui.stopSpeech();GXT.requestXAction=original;}
  }]);
  tests.push(['removing a speaking X post stops only its own speech session',async()=>{
    await settings({enabled:true,ttsEnabled:true});const el=tweet('A speaking post removed by timeline virtualization.');await until(()=>body(el));
    const original=GXT.ui.speak;let stopped=0;
    GXT.ui.speak=()=>({stop:()=>stopped++});
    try {
      const speaker=[...el.nextElementSibling.querySelectorAll('[role=button]')].find(button=>button.textContent==='🔊');
      assert(speaker,'read-aloud button missing');speaker.click();el.closest('article').remove();await until(()=>stopped===1,'removed post kept speaking');
    } finally {GXT.ui.speak=original;}
  }]);
  tests.push(['warm remounted pinned post bypasses dwell delay without a new request',async()=>{
    await settings({enabled:true,dwellMode:false});
    const el=tweet('A pinned post remains warm across profile navigation.');
    await until(()=>body(el),'initial translation missing');const count=sent.length;
    el.closest('article').remove();await sleep(90);await settings({dwellMode:true});
    const replacement=tweet('A pinned post remains warm across profile navigation.');
    await until(()=>body(replacement),'warm post waited for dwell',500);
    assert(sent.length===count,'warm post created a provider request');
  }]);
  tests.push(['React moving an existing card retains its translation and request identity',async()=>{
    await settings({enabled:true,dwellMode:false});const el=tweet('A card moved within one React commit.');
    await until(()=>body(el),'translation missing');const box=el.nextElementSibling,count=sent.length;
    fixture.append(el.closest('article'));await sleep(150);
    assert(el.nextElementSibling===box,'moving a card tore down its UI');assert(sent.length===count,'moving caused a new request');
    assert(el.textContent==='A card moved within one React commit.','source post mutated');
  }]);
  tests.push(['a detached post response warms the next mount without painting a different post',async()=>{
    await settings({enabled:true,dwellMode:false});const text='A detached original completes while another profile is visible.';
    const finish=deferText(text),el=tweet(text);await until(()=>sentText(text),'initial request missing');
    el.closest('article').remove();await sleep(80);finish({ok:true,t:'ترجمهٔ ذخیره‌شده',sl:'en'});await sleep(100);
    const count=sent.length;const mounted=tweet(text);await until(()=>body(mounted),'returning post not rendered');
    assert(body(mounted).textContent==='ترجمهٔ ذخیره‌شده','cached result missing');assert(sent.length===count,'detached result was discarded');
  }]);
  await sleep(50); let passed = 0; const lines = [];
  for (const [name, fn] of tests) {
    let ok = false, detail = '';
    try { await fn(); ok = true; passed++; } catch (error) { detail = ': ' + error.message; }
    const line = `GXT-X-LIFECYCLE ${ok ? 'PASS' : 'FAIL'} ${name}${detail}`;
    console.log(line); lines.push(line); document.getElementById('summary').textContent = lines.join('\n');
    await settings({ enabled: false, mode: 'auto', dwellMode: false, provider: 'gemini', translateBios: true, xExtraZones: false, composerTranslate: false, xImageButton: false, replaceOriginal: false });
    fixture.replaceChildren(); routes.clear(); sent.length = 0; composeRoute = null; imageRoute = null; await sleep(30);
