<!doctype html><html><meta charset="utf-8"><title>Media lifecycle regressions</title>
<style>body{font:13px monospace}#fixture img{width:400px;height:600px}#summary{white-space:pre-wrap}</style>
<div id="fixture"></div><pre id="summary">running</pre>
<script>
globalThis.GXT_SHIM_SEED={settings:{enabled:true,composerTranslate:true,xImageButton:true},apiKeys:['dev-key']};
const calls=[];let route=()=>({ok:false,code:'DEV'});
globalThis.GXT_SHIM_HANDLER=(message)=>{calls.push(message);return route(message)};
</script>
<script src="chrome-shim.js"></script><script src="../shared/settings.js"></script>
<script src="../shared/theme.js"></script><script src="../content/ui.js"></script>
<script src="../content/composer.js"></script><script src="../content/manga.js"></script>
<script>
const fixture=document.getElementById('fixture');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,reason='assertion failed')=>{if(!ok)throw Error(reason)};
const deferred=()=>{let resolve;const promise=new Promise(r=>resolve=r);return{promise,resolve}};
async function until(fn,reason='timed out'){const end=Date.now()+3500;while(Date.now()<end){if(fn())return;await sleep(20)}throw Error(reason)}
let config;async function settings(patch){config={...config,...patch};await chrome.storage.local.set({settings:config})}
const root=()=>document.querySelector('[data-gxt-ui]')?.shadowRoot;
function png(color){const c=document.createElement('canvas');c.width=400;c.height=600;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c.toDataURL()}
const originals=[png('red'),png('blue'),png('purple')],translated=png('green');
async function media(){const article=document.createElement('article'),img=document.createElement('img');img.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"><!-- pbs.twimg.com/media/first --></svg>';article.append(img);fixture.append(article);await until(()=>article.querySelector('.gxt-imgbtn'));return{img,btn:article.querySelector('.gxt-imgbtn')}}
async function page(src=originals[0]){const img=document.createElement('img');img.src=src;fixture.append(img);await img.decode();return img}
function mangaRoute(pending){route=m=>m.type==='MANGA_START'?{ok:true,job:'job',indexMap:[0]}:m.type==='MANGA_STATUS'?{ok:true,ready:[0],done:true}:m.type==='MANGA_PAGE'?pending.promise:{ok:true}}
const tests=[
 ['image request rejects a recycled image source',async()=>{const d=deferred();route=()=>d.promise;const{img,btn}=await media();btn.click();img.src=img.src.replace('first','second');d.resolve({ok:true,t:'STALE IMAGE'});await sleep(80);assert(!root().textContent.includes('STALE IMAGE'),'old translation displayed for recycled image')}],
 ['image request rejects detached source',async()=>{const d=deferred();route=()=>d.promise;const{img,btn}=await media();btn.click();img.remove();d.resolve({ok:true,t:'DETACHED IMAGE'});await sleep(80);assert(!root().textContent.includes('DETACHED IMAGE'),'detached image result displayed')}],
 ['image request rejects provider change even after settings return',async()=>{const d=deferred();route=()=>d.promise;const{btn}=await media();btn.click();await settings({provider:'google'});await settings({provider:'gemini'});d.resolve({ok:true,t:'STALE PROVIDER'});await sleep(80);assert(!root().textContent.includes('STALE PROVIDER'),'provider generation not retired')}],
 ['composer preserves draft after provider changes',async()=>{const editor=document.createElement('div');editor.dataset.testid='tweetTextarea_0';editor.contentEditable='true';editor.textContent='متن فارسی برای آزمون';fixture.append(editor);await until(()=>editor.nextElementSibling?.querySelector('.gxt-chip-btn'));const d=deferred();route=()=>d.promise;editor.nextElementSibling.querySelector('.gxt-chip-btn').click();await settings({provider:'google'});d.resolve({ok:true,t:'STALE COMPOSER'});await sleep(80);assert(editor.innerText==='متن فارسی برای آزمون','outdated provider replaced user draft')}],
 ['manga late page cannot replace recycled reader image',async()=>{const img=await page(),d=deferred();mangaRoute(d);const running=GXT.manga.startHere();await until(()=>calls.some(m=>m.type==='MANGA_PAGE'));img.src=originals[1];await img.decode();d.resolve({ok:true,dataUrl:translated});await running;assert(img.src===originals[1],'late old chapter overwrote new image')}],
 ['manga toggle preserves recycled image after successful translation',async()=>{const img=await page(),d=deferred();mangaRoute(d);d.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();assert(img.src===translated);img.src=originals[1];await img.decode();GXT.manga.setAllTranslated(false);assert(img.src===originals[1],'restore overwrote new chapter');GXT.manga.setAllTranslated(true);assert(img.src===originals[1],'toggle reapplied old chapter')}],
 ['manga rerun sends original page instead of translated pixels',async()=>{const img=await page(),d=deferred();mangaRoute(d);d.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();assert(img.src===translated);calls.length=0;await GXT.manga.startHere();assert(calls.find(m=>m.type==='MANGA_START').urls[0]===originals[0],'manual retry retranslates already translated pixels')}],
 ['manga cancellation releases UI before a delayed status response',async()=>{const img=await page(),d=deferred();route=m=>m.type==='MANGA_START'?{ok:true,job:'old'}:m.type==='MANGA_STATUS'?d.promise:{ok:true};const running=GXT.manga.startHere();await until(()=>calls.some(m=>m.type==='MANGA_STATUS'));await GXT.manga.cancel();const released=!GXT.manga._internal.isRunning();d.resolve({ok:true,ready:[],done:true});await running;assert(released,'stop remains running until old network request finishes')}],
 ['manga settings OFF cancels pending page rendering',async()=>{const img=await page(),d=deferred();mangaRoute(d);const running=GXT.manga.startHere();await until(()=>calls.some(m=>m.type==='MANGA_PAGE'));await settings({enabled:false});d.resolve({ok:true,dataUrl:translated});await running;assert(img.src===originals[0],'disabled extension modified page')}],
 ['manga normal completion remains reversible for 30 cycles',async()=>{for(let i=0;i<30;i++){const img=await page(originals[i%3]),d=deferred();mangaRoute(d);d.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();assert(img.src===translated);GXT.manga.setAllTranslated(false);assert(img.src===originals[i%3]);GXT.manga.setAllTranslated(true);assert(img.src===translated);img.remove();GXT.manga._internal.pruneDetached();assert(!GXT.manga._internal.originals.size&&!GXT.manga._internal.translated.size,'retained detached image');}}],
 ['image latest request wins through 20 reverse completion cycles',async()=>{const{btn}=await media();for(let i=0;i<20;i++){const d=deferred();let n=0;route=()=>++n===1?d.promise:{ok:true,t:'LATEST '+i};btn.click();btn.click();await until(()=>root().textContent.includes('LATEST '+i));d.resolve({ok:true,t:'STALE '+i});await sleep(10);assert(!root().textContent.includes('STALE '+i))}}],
 ['manga old cancelled page cannot overwrite a completed restart',async()=>{const img=await page(),old=deferred();mangaRoute(old);const first=GXT.manga.startHere();await until(()=>calls.some(m=>m.type==='MANGA_PAGE'));await GXT.manga.cancel();const fresh=deferred();mangaRoute(fresh);fresh.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();old.resolve({ok:true,dataUrl:originals[2]});await first;assert(img.src===translated);assert(!GXT.manga._internal.isRunning())}],
 ['manga late start acknowledgement cancels only the retired job',async()=>{await page();const old=deferred();route=m=>m.type==='MANGA_START'?old.promise:{ok:true};const first=GXT.manga.startHere();await until(()=>calls.some(m=>m.type==='MANGA_START'));await GXT.manga.cancel();const fresh=deferred();mangaRoute(fresh);fresh.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();const status=root().textContent;old.resolve({ok:true,job:'retired-job'});await first;assert(root().textContent===status,'old completion changed restart panel');assert(calls.some(m=>m.type==='MANGA_CANCEL'&&m.job==='retired-job'))}],
 ['manga automatic watcher discovers src-only recycled pages',async()=>{const img=await page(),d=deferred();mangaRoute(d);d.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere({auto:true});img.src=originals[1];await img.decode();await until(()=>calls.filter(m=>m.type==='MANGA_START').length===2,'src-only new page was ignored');await until(()=>img.src===translated);await sleep(2700);assert(calls.filter(m=>m.type==='MANGA_START').length===2,'watcher retranslates its own result')}],
 ['manga original loading attribute survives repeated toggles',async()=>{const img=await page();img.loading='lazy';const d=deferred();mangaRoute(d);d.resolve({ok:true,dataUrl:translated});await GXT.manga.startHere();GXT.manga.setAllTranslated(false);assert(img.getAttribute('loading')==='lazy','original lazy loader setting lost')}],
];
(async()=>{await sleep(70);config=await GXT.getSettings();let passed=0;const lines=[];for(const[name,fn]of tests){let error='';try{await fn();passed++}catch(e){error=e.message}const line=`GXT-MEDIA-LIFECYCLE ${error?'FAIL':'PASS'} ${name}${error?': '+error:''}`;console.log(line);lines.push(line);await GXT.manga.cancel();GXT.manga.stopWatching();GXT.ui.closeAll();fixture.replaceChildren();GXT.manga._internal.pruneDetached();calls.length=0;await settings({enabled:true,provider:'gemini',xImageButton:true,composerTranslate:true});await sleep(30)}document.getElementById('summary').textContent=lines.join('\n');console.log(`GXT-MEDIA-LIFECYCLE SUMMARY ${passed}/${tests.length}`)})();
</script></html>
